<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg"
  width="400" height="400" viewBox="0 0 225 225">

  <defs>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stronger glow -->
    <filter id="strongGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip for draw-on effect -->
    <clipPath id="revealClip">
      <rect x="0" y="0" width="225" height="0">
        <animate attributeName="height" from="0" to="225" dur="1.8s" fill="freeze" calcMode="spline"
          keySplines="0.4 0 0.2 1" begin="0.2s"/>
      </rect>
    </clipPath>

    <!-- Radial gradient background pulse -->
    <radialGradient id="bgPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a2a">
        <animate attributeName="stop-color"
          values="#2a2a2a;#1a1a2e;#16213e;#1a1a2e;#2a2a2a"
          dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Orange/gold gradient for logo -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff">
        <animate attributeName="stop-color"
          values="#ffffff;#ffe4a0;#ffcc44;#ffe4a0;#ffffff"
          dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ffe4a0">
        <animate attributeName="stop-color"
          values="#ffe4a0;#ffffff;#ffe4a0;#ffcc44;#ffe4a0"
          dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffcc44">
        <animate attributeName="stop-color"
          values="#ffcc44;#ffe4a0;#ffffff;#ffe4a0;#ffcc44"
          dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Spark particles -->
    <circle id="spark" r="2" fill="#ffcc44" opacity="0"/>
  </defs>

  <!-- Animated background circle -->
  <circle cx="112.5" cy="112.5" r="108" fill="url(#bgPulse)">
    <animate attributeName="r" values="108;112;108" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Outer ring glow pulse -->
  <circle cx="112.5" cy="112.5" r="110" fill="none" stroke="#ffcc44" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0;0.5;0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="108;114;108" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="112.5" cy="112.5" r="106" fill="none" stroke="#ff8c00" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0;0.3;0" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </circle>

  <!-- === MAIN LOGO GROUP === -->
  <!-- Wrapper: entrance scale + fade -->
  <g transform="translate(112.5, 112.5)">
    <g id="logoMain" opacity="0" transform="scale(0.5)">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale"
        from="0.5" to="1" dur="0.8s" begin="0.2s" fill="freeze"
        calcMode="spline" keySplines="0.34 1.56 0.64 1"/>

      <!-- Logo paths, centered at origin -->
      <g transform="translate(-112.5, -112.5) translate(0,225) scale(0.1,-0.1)"
         fill="url(#logoGrad)" filter="url(#glow)">

        <!-- Chef hat + face -->
        <path d="M974 1906 c-89 -28 -182 -120 -199 -196 -4 -20 -20 -38 -49 -56 -118
-74 -136 -216 -39 -305 43 -40 87 -59 139 -59 l46 0 -7 -47 c-3 -27 -9 -58
-12 -70 l-5 -23 43 17 c33 13 77 17 174 17 126 1 132 0 196 -30 37 -18 85 -49
108 -69 l41 -37 0 97 0 97 33 -9 c64 -16 125 -8 170 23 116 82 140 248 51 352
-18 21 -36 52 -39 68 -13 55 -67 123 -119 149 -51 26 -146 33 -190 16 -14 -5
-34 2 -68 25 -27 19 -66 38 -86 44 -50 13 -138 12 -188 -4z m233 -62 c29 -14
