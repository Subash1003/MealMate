19 164 168 175 158 7 -7 -18 -37 -71 -89z"/>

        <!-- Smile arc -->
        <path d="M904 792 c41 -80 154 -119 258 -88 51 14 115 53 105 62 -2 3 -17 0
-33 -6 -105 -41 -210 -32 -294 25 l-50 33 14 -26z"/>
      </g>
    </g>
  </g>

  <!-- Floating sparkles -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" dur="4s" begin="1s" repeatCount="indefinite"/>

    <circle cx="30" cy="40" r="2.5" fill="#ffcc44">
      <animate attributeName="cy" values="40;20;40" dur="2s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="195" cy="35" r="2" fill="#ff8c00">
      <animate attributeName="cy" values="35;15;35" dur="2.3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="210" cy="180" r="1.8" fill="#ffcc44">
      <animate attributeName="cy" values="180;160;180" dur="1.8s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="170" r="2.2" fill="#ffe4a0">
      <animate attributeName="cy" values="170;150;170" dur="2.5s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="112" cy="15" r="1.5" fill="#ffffff">
      <animate attributeName="cy" values="15;5;15" dur="2.1s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.1s" begin="2.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Star sparkles -->
    <text x="185" y="65" font-size="10" fill="#ffcc44" opacity="0" text-anchor="middle">✦
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 185 65" to="180 185 65" dur="2s" begin="2s" repeatCount="indefinite"/>
    </text>
    <text x="35" y="75" font-size="8" fill="#ff8c00" opacity="0" text-anchor="middle">✦
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="2.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Rotating outer dashes ring -->
  <circle cx="112.5" cy="112.5" r="106"
    fill="none" stroke="#ffcc44" stroke-width="1"
    stroke-dasharray="6 14" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate"
      from="0 112.5 112.5" to="360 112.5 112.5"
      dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- Counter-rotating inner dashes -->
  <circle cx="112.5" cy="112.5" r="102"
    fill="none" stroke="#ff8c00" stroke-width="0.6"
    stroke-dasharray="3 20" opacity="0.2">
    <animateTransform attributeName="transform" type="rotate"
      from="360 112.5 112.5" to="0 112.5 112.5"
      dur="18s" repeatCount="indefinite"/>
  </circle>

  <!-- Breathing glow behind logo -->
  <circle cx="112.5" cy="112.5" r="80" fill="#ffaa00" opacity="0">
    <animate attributeName="opacity" values="0;0.08;0;0.05;0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="75;85;75" dur="3s" repeatCount="indefinite"/>
  </circle>

</svg>
