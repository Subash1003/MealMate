15 -113 54 -21 20 -56 41 -77 48 -33 10 -40 9 -60 -10 -30 -28 -62 -28 -81 0
-23 33 -20 56 13 89 32 32 30 36 -9 16z"/>

        <!-- Spatulas -->
        <path d="M545 1038 c-53 -29 -115 -106 -115 -142 0 -23 76 -112 125 -146 61
-42 101 -53 143 -39 32 11 36 9 75 -28 58 -54 118 -100 216 -166 l85 -56 -80
