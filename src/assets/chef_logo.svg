        <!-- Mustache -->
        <path d="M1040 1127 c-14 -7 -32 -27 -40 -44 -8 -18 -23 -33 -32 -33 -9 0 -29
-11 -45 -24 -42 -35 -68 -46 -107 -46 -42 0 -45 -9 -11 -42 46 -46 146 -61
