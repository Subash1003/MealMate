<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg"
  width="400" height="400" viewBox="0 0 225 225">

  <defs>
    <!-- Soft glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip for LEFT spatula: reveal from center outward to left -->
    <clipPath id="clipLeft">
      <rect x="0" y="0" width="0" height="225">
        <!-- Start invisible, expand to cover left spatula area -->
        <animate id="animLeft" attributeName="width"
          from="0" to="225" dur="0.7s" begin="0.3s"
          fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </rect>
    </clipPath>

    <!-- Clip for RIGHT spatula: reveal from center outward to right -->
    <clipPath id="clipRight">
      <rect x="225" y="0" width="0" height="225">
        <animate attributeName="x"
          from="225" to="0" dur="0.7s" begin="1.2s"
          fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
        <animate attributeName="width"
          from="0" to="225" dur="0.7s" begin="1.2s"
          fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </rect>
    </clipPath>

    <!-- Clip for head/hat: fade reveal -->
    <clipPath id="clipHead">
      <rect x="0" y="0" width="225" height="0">
        <animate attributeName="height"
          from="0" to="225" dur="0.5s" begin="2.1s"
          fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="225" height="225" rx="0" fill="#D95B0B"/>


  <!-- Dark circular background -->
  <circle cx="112.5" cy="112.5" r="112.5" fill="#D95B0B"/>

